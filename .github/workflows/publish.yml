name: publish
# Publishes to PyPI with "trusted publishing" (no token stored). One-time setup on pypi.org:
#   add a pending publisher: project localvoice-ai, owner keshore, repo localvoice-ai, workflow publish.yml, environment pypi.
# Then set the repository variable PUBLISH_TO_PYPI=true and publish a GitHub release.
on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  pypi:
    if: ${{ vars.PUBLISH_TO_PYPI == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
