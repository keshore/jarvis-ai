name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      # Heavy audio/model dependencies are not needed: the unit tests cover the portable logic only.
      - run: pip install numpy pytest tomli
      - run: pip install -e . --no-deps
      - run: pytest -q
