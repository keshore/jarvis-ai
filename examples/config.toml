# Copy to ~/.jarvis-ai/config.toml. Most of these can also be changed in the window (Settings).
voice = "af_bella"          # see Settings for the list of voices
speed = 1.05
brain = "auto"              # auto | claude | openai | local
claude_model = "claude-opus-5-5"
retention_days = 30         # -1 = save nothing, 0 = keep until deleted, N = days
end_silence = 1.1           # raise to 1.5 to 2 if you pause to think
# wake_word = "hey jarvis"  # ignore speech until you say it
# call_me = "sir"
# persona = "cheerful and brief"
