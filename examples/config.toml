# Copy to ~/.jarvis-ai/config.toml
stt_model = "mlx-community/whisper-small.en-mlx"   # or mlx-community/whisper-large-v3-turbo
voice = "af_bella"          # Kokoro voices: af_heart af_bella af_nicole am_michael bf_emma bm_george
speed = 1.05
sink = "iterm"              # iterm | tmux | keystroke | exec | stdout
mode = "brief"              # automatic speech: brief | full
end_silence = 1.1
# exec_cmd = "ollama run llama3.2"     # sink = "exec": text on stdin, reply is printed and spoken
# app = "Google Chrome"                # sink = "keystroke": bring this app to front before typing
